name: scrap_ftb_schedule_odds_seq

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1,3,5,6,0'  # UTC

permissions:
  contents: write

concurrency:
  group: scrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    services:
      selenium:
        image: selenium/standalone-firefox:111.0-20230328
        ports: ['4444:4444']
        volumes:
          - /github/workspace/data/downloads:/home/seluser/Downloads
        options: --shm-size=2g
    steps:
      - uses: actions/checkout@v3
        with: { fetch-depth: 0 }

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }

      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { needs: check }

      - name: scrap schedule
        run: Rscript scrap_ftb.R --type schedule

      - name: Check disk and memory
        run: |
          df -h
          free -h || true

      - name: Commit files (schedule)
        run: |
          git config user.name actions-user
          git config user.email "actions@github.com"
          git add data/ftb/* log/* || true
          git commit -m "GH ACTION schedule $(date)" || echo "Nothing to commit"
          git push origin main